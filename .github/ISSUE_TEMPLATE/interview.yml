name: Interview practice
description: Run a graded mock interview with /interview
title: "Interview Practice:"
labels: ["agent:status:todo", "model:sonnet"]
body:
  - type: textarea
    id: jd
    attributes:
      label: Job description
      description: >
        Paste the JD or a link to it. If you attach a document describing the real
        interview structure — round names, focus areas, evaluation criteria — it is
        treated as ground truth and overrides the default question blocks.
    validations:
      required: true
  - type: dropdown
    id: practice-focus
    attributes:
      label: Practice focus
      description: Shifts question weighting toward one area.
      options:
        - None — balanced interview
        - Product thinking
        - Behavioural / STAR
        - Strategy and prioritisation
        - Technical depth
        - Stakeholder and conflict
      default: 0
  - type: input
    id: custom-focus
    attributes:
      label: Custom focus
      description: Anything more specific. Overrides the dropdown when filled in.
